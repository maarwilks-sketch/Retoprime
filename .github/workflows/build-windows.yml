name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RETOPRIME_VCPKG_ROOT: ${{ github.workspace }}\\retoprime-vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/retoprime-vcpkg-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Bootstrap vcpkg client
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:RETOPRIME_VCPKG_ROOT
          if ($LASTEXITCODE -ne 0) { throw "vcpkg clone failed" }
          & "$env:RETOPRIME_VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          "VCPKG_ROOT=$env:RETOPRIME_VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Restore compiled dependencies
        uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: retoprime-windows-v1-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
      - name: Configure native release build
        shell: pwsh
        run: >-
          cmake -S . -B build/windows-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DRETOPRIME_ENABLE_QUADRIFLOW_EXTERNAL=ON
          -DRETOPRIME_ALLOW_NO_QPROCESS_FOR_TESTS=OFF
          -DBUILD_TESTING=ON
      - name: Save compiled dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Build RETOPRIME and QuadriFlow
        shell: pwsh
        run: cmake --build build/windows-release --target retoprime_release RETOPRIME_tests
      - name: Test engine and desktop workflow
        shell: pwsh
        run: ctest --test-dir build/windows-release --output-on-failure --timeout 180
      - name: Stage portable application
        shell: pwsh
        run: |
          $appDir = Join-Path $PWD 'build\windows-release\src\app'
          $packageDir = Join-Path $PWD 'build\windows-release\package'
          $packageExe = Join-Path $packageDir 'RETOPRIME.exe'
          $installed = Join-Path $PWD 'build\windows-release\vcpkg_installed\x64-windows'
          $windeployqt = Get-ChildItem (Join-Path $installed 'tools') -Recurse -Filter windeployqt.exe | Select-Object -First 1 -ExpandProperty FullName
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item -Path (Join-Path $appDir '*') -Destination $packageDir -Recurse -Force
          if (-not $windeployqt) { throw "windeployqt was not installed" }
          & $windeployqt --release --no-translations --compiler-runtime $packageExe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with exit code $LASTEXITCODE" }
          # The helper is a separate executable: its DLLs must be beside it.
          $helperDir = Join-Path $packageDir 'engine'
          $helperBuild = Join-Path $PWD 'build\windows-release\quadriflow\src\quadriflow_external-build'
          Get-ChildItem $helperBuild -Filter *.dll | Copy-Item -Destination $helperDir -Force
          Get-ChildItem $packageDir -File | Where-Object { $_.Name -match '^(msvcp|vcruntime|concrt).*\.dll$' } | Copy-Item -Destination $helperDir -Force
          $licenseDir = Join-Path $packageDir 'licenses'
          New-Item -ItemType Directory -Force -Path $licenseDir | Out-Null
          Copy-Item 'installer\licenses\QuadriFlow-LICENSE.txt' $licenseDir
          Get-ChildItem (Join-Path $installed 'share') -Directory | ForEach-Object {
            $copyright = Join-Path $_.FullName 'copyright'
            if (Test-Path $copyright) { Copy-Item $copyright (Join-Path $licenseDir ($_.Name + '.txt')) }
          }
          Copy-Item 'PORTABLE-README.txt' (Join-Path $packageDir 'README.txt')
          if (-not (Test-Path 'build\windows-release\package\RETOPRIME.exe')) { throw 'Packaged RETOPRIME.exe is missing' }
          if (-not (Test-Path 'build\windows-release\package\engine\retoprime-quads.exe')) { throw 'Packaged QuadriFlow helper is missing' }
      - name: Smoke test portable application
        shell: pwsh
        run: |
          $packageDir = Join-Path $PWD 'build\windows-release\package'
          $exePath = Join-Path $packageDir 'RETOPRIME.exe'
          $cmake = (Get-Command cmake).Source
          $inputMesh = Join-Path $PWD 'tests\fixtures\cube-triangulated.obj'
          $outputMesh = Join-Path $env:RUNNER_TEMP 'retoprime-portable-result.obj'
          # Do not allow the developer environment to hide missing dependencies.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          & $cmake "-DAPP=$exePath" "-DINPUT=$inputMesh" "-DOUTPUT=$outputMesh" -P tests/cmake/DesktopSmoke.cmake
          if ($LASTEXITCODE -ne 0) { throw "Portable import / retopology / export failed" }
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path 'build\windows-release\package\*' -DestinationPath 'build\windows-release\RETOPRIME-Windows.zip' -Force
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RETOPRIME-Windows
          path: build/windows-release/RETOPRIME-Windows.zip
          if-no-files-found: error
